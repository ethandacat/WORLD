<!DOCTYPE html>

<html>
<head>
<title>ethan's world</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
font-family:Nunito,sans-serif;color:white;overflow:hidden;
background:linear-gradient(#0004,#0009),url("https://images.pexels.com/photos/956981/milky-way-starry-sky-night-sky-star-956981.jpeg") center/cover;
}
main{max-width:800px;padding:30px}
h1{
font-size:clamp(60px,12vw,140px);line-height:.85;margin:0;
font-weight:1000;letter-spacing:-.06em;
-webkit-text-stroke:5px #222;
text-shadow:0 10px #222,0 20px 30px #0008;
animation:w 3s ease-in-out infinite;
}
h2{margin:30px 0 10px}
p{font-size:18px;line-height:1.5}
img{position:fixed;width:20%;max-width:250px;animation:w 3s ease-in-out infinite}
#earth{left:0;bottom:-30px}
#ftc{right:0;bottom:0}
a{color:white}
@keyframes w{50%{transform:rotate(2deg) translateY(-8px)}}
</style>
</head>
<body>
<main>
<h1>welcome to<br>ethan's world</h1>
<h2>I'm a 13 year old programmer!</h2>
<p>I'm a part of the multiple time award winning FTC team 23562 as the lead programmer. I'm not too experienced with HTML (okay maybe that's a lie but) anywaays I love coding and having fun with my friends! Oh, and cats.</p>
</main>
<img id="earth" src="https://cliparts.co/cliparts/rij/KbA/rijKbAjRT.jpg">
<img id="ftc" src="https://i.ibb.co/fYrkRs4W/image-3.png">
</body>
</html>
